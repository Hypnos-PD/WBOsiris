name: Release desktop client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空用 git describe）
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Build client and installer
        env:
          WBO_VERSION: ${{ inputs.version }}
        run: pwsh -File scripts/release/build-windows.ps1 -Version "$env:WBO_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: WBOsiris-windows
          path: |
            dist/WBOsiris-*-windows-amd64.exe
            desktop/build/bin/*-installer.exe

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GTK/WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2 file
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Bundle home illustrations (675 MB, verbatim)
        run: node scripts/bundle_illustrations.mjs --data ../WBArts/data --out web/public/assets/home || true
      - name: Build AppImage
        env:
          WBO_VERSION: ${{ inputs.version }}
          PATH: /home/runner/go/bin:/usr/local/go/bin:/usr/bin:/bin
        run: scripts/release/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WBOsiris-linux
          path: dist/*.AppImage
