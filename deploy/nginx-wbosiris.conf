# 放到站点的 proxy 目录（与 api.conf 并列，vhost 会 include proxy/*.conf）：
#   /opt/1panel/www/sites/sva.hypd.asia/proxy/wbosiris.conf
#
# 规则服务挂在 /wbo/ 前缀下：/wbo/api/* 是对局接口，/wbo/illustration-assets/*
# 是本地素材（线上素材请直接用站点自己的 /data/home-illustration/…）。
location ^~ /wbo/ {
    proxy_pass http://127.0.0.1:23216/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 真实访客 IP（与 server/nginx-analytics-headers.conf 一致，供限流使用）
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-WBA-Edge-IP $remote_addr;
    proxy_set_header X-WBA-Country $http_cf_ipcountry;
    proxy_set_header X-WBA-Region $http_cf_region;
    proxy_set_header X-WBA-City $http_cf_ipcity;
    proxy_set_header X-WBA-Timezone $http_cf_timezone;

    # 对局状态用 SSE 推送：必须关掉缓冲，并放宽读超时（服务端每 15 秒心跳）。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
}
